<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orientador Vocacional AI - EXPO</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f2fe;
    --blue: #4facfe;
    --dark: #0a0a0f;
    --surface: #111118;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Outfit', sans-serif;
    overflow: hidden;
  }

  /* Fondo animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(79,172,254,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 80% 80%, rgba(0,242,254,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 520px;
    padding: 20px;
    gap: 28px;
  }

  /* Orb */
  .orb-wrap {
    position: relative;
    width: 100px;
    height: 100px;
  }
  .orb {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #a0e9ff, #4facfe 50%, #0070d4);
    box-shadow: 0 0 50px rgba(79,172,254,0.5), 0 0 100px rgba(79,172,254,0.2);
    animation: breathe 3s ease-in-out infinite;
  }
  .orb-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1.5px solid rgba(79,172,254,0.25);
    animation: spin 8s linear infinite;
  }
  .orb-ring::after {
    content: '';
    position: absolute;
    top: -3px; left: 50%;
    width: 6px; height: 6px;
    background: var(--cyan);
    border-radius: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 8px var(--cyan);
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.96); box-shadow: 0 0 40px rgba(79,172,254,0.4); }
    50%       { transform: scale(1.04); box-shadow: 0 0 80px rgba(79,172,254,0.7); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Título */
  .title {
    text-align: center;
    color: white;
  }
  .title h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 40%, var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title p {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    margin-top: 4px;
    font-weight: 300;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* Contenedor del widget */
  #vf-container {
    width: 100%;
    height: 70vh;
    min-height: 420px;
    max-height: 600px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(79,172,254,0.15);
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* Loading state */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 420px;
    gap: 16px;
    color: rgba(255,255,255,0.4);
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }
  .loading-dots {
    display: flex; gap: 6px;
  }
  .loading-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--blue);
    animation: dot 1.2s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: .2s; }
  .loading-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot {
    0%,80%,100% { transform: scale(0.6); opacity: 0.3; }
    40%          { transform: scale(1);   opacity: 1; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="orb-wrap">
    <div class="orb"></div>
    <div class="orb-ring"></div>
  </div>

  <div class="title">
    <h1>Orientador Vocacional AI</h1>
    <p>Descubre tu camino profesional</p>
  </div>

  <div id="vf-container">
    <div class="loading" id="loading-state">
      <div class="loading-dots">
        <span></span><span></span><span></span>
      </div>
      Iniciando orientador...
    </div>
  </div>

</div>

<script type="text/javascript">
(function(d, t) {
  var v = d.createElement(t), s = d.getElementsByTagName(t)[0];

  v.onload = function() {
    window.voiceflow.chat.load({
      verify: { projectID: '69c7fbdf88b4175636bc269c' },
      url: 'https://general-runtime.voiceflow.com',
      versionID: 'production',
      render: {
        mode: 'embedded',
        target: document.getElementById('vf-container')
      },
      autostart: true,
      session: { userID: 'kiosk-' + Date.now() }, // sesión única por visita, sin clear
      stylesheet: "data:text/css," + encodeURIComponent(`
        /* Limpiar fondo del widget */
        .vfrc-widget--embedded {
          background: transparent !important;
          box-shadow: none !important;
          border: none !important;
          border-radius: 20px !important;
          overflow: hidden !important;
        }
        /* Ocultar header de Voiceflow */
        .vfrc-header { display: none !important; }
        /* Ocultar footer / input de texto */
        .vfrc-footer { display: none !important; }
        /* Estilo de mensajes del bot */
        .vfrc-message--from-ai .vfrc-bubble {
          background: rgba(255,255,255,0.06) !important;
          color: rgba(255,255,255,0.9) !important;
          border: 1px solid rgba(79,172,254,0.2) !important;
          border-radius: 14px !important;
          font-family: 'Outfit', sans-serif !important;
          font-size: 15px !important;
          line-height: 1.6 !important;
        }
        /* Botones de opciones */
        .vfrc-button {
          background: rgba(79,172,254,0.1) !important;
          color: white !important;
          border: 1px solid rgba(79,172,254,0.3) !important;
          border-radius: 12px !important;
          padding: 14px 18px !important;
          font-size: 15px !important;
          font-family: 'Outfit', sans-serif !important;
          margin-bottom: 10px !important;
          transition: all 0.25s ease !important;
          cursor: pointer !important;
        }
        .vfrc-button:hover {
          background: rgba(79,172,254,0.25) !important;
          border-color: #4facfe !important;
          transform: translateY(-1px) !important;
        }
        /* Área de chat */
        .vfrc-chat {
          background: transparent !important;
        }
        /* Scrollbar */
        .vfrc-chat::-webkit-scrollbar { width: 4px; }
        .vfrc-chat::-webkit-scrollbar-thumb {
          background: rgba(79,172,254,0.2);
          border-radius: 2px;
        }
      `)
    });

    // Ocultar loading cuando el widget esté listo
    setTimeout(() => {
      const loader = document.getElementById('loading-state');
      if (loader) loader.style.display = 'none';
    }, 1500);
  };

  v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs";
  v.type = "text/javascript";
  s.parentNode.insertBefore(v, s);
})(document, 'script');
</script>
</body>
</html>
